name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fresh database for every run; the first admin gets this password.
      QFLOW_DATA_DIR: ${{ github.workspace }}/.ci-data
      QFLOW_ADMIN_PASSWORD: CiAdmin123!
      SESSION_SECRET: ci-session-secret
      # Do not trust X-Forwarded-For from localhost, so spoofing can be tested.
      TRUST_PROXY: 'false'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Audit production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          HOST=127.0.0.1 PORT=3000 node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1

      - name: Run e2e (Playwright)
        run: npm run test:e2e

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t qflow-pro:ci .

      - name: Smoke test container
        run: |
          docker run -d --name qflow -p 3000:3000 -e QFLOW_ADMIN_PASSWORD=CiAdmin123! qflow-pro:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs qflow; exit 1
